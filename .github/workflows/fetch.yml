name: Fetch PubMed papers

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 22:00 UTC = 07:00 KST
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "최근 며칠치를 수집할지 (과거 논문 일괄 수집: 365, 1825 등)"
        default: "3"
      max_summaries:
        description: "이번 실행에서 만들 AI 요약 개수 (기본 0 = 요약 없이 수집만. 일괄 요약이 필요할 때만 숫자를 넣으세요)"
        default: "0"
      force_digest:
        description: "추천 메일 지금 바로 보내기 (테스트용, 1로 설정)"
        default: "0"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_pubmed.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_SUMMARIES: ${{ github.event.inputs.max_summaries || '0' }}
      - name: Prune old untouched papers if near storage limit
        if: always()
        run: python scripts/prune.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRUNE_TARGET_MB: ${{ vars.PRUNE_TARGET_MB || '420' }}
          PRUNE_KEEP_DAYS: ${{ vars.PRUNE_KEEP_DAYS || '365' }}
          PRUNE_BATCH: ${{ vars.PRUNE_BATCH || '200' }}
      - name: Recommendations + digest email
        if: always()
        run: python scripts/recommend.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DIGEST_FORCE: ${{ github.event.inputs.force_digest || '0' }}
